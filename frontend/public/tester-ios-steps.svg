<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ghostel iOS tester guide</title>
  <desc id="desc">Four steps for iOS testers: install TestFlight, open invitation, install Ghostel and report bugs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#162554"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11203a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="150" cy="132" r="62" fill="#60a5fa" opacity="0.18"/>
  <circle cx="1430" cy="115" r="82" fill="#d946ef" opacity="0.14"/>
  <text x="90" y="110" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">iOS testing</text>
  <text x="90" y="158" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="26">Ghostel TestFlight guide</text>

  <g transform="translate(80,230)">
    <rect width="330" height="500" rx="30" fill="url(#card)" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="64" cy="66" r="30" fill="#60a5fa"/>
    <text x="55" y="78" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">1</text>
    <text x="42" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">Install</text>
    <text x="42" y="183" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">TestFlight</text>
    <text x="42" y="228" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">Get TestFlight from</text>
    <text x="42" y="262" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">the App Store.</text>
    <rect x="93" y="320" width="144" height="144" rx="34" fill="#08131f" stroke="#93c5fd" stroke-width="3"/>
    <path d="M132 410l58-62 18 18-58 62z" fill="#60a5fa"/>
    <path d="M188 355l18-18 40 40-18 18z" fill="#bfdbfe"/>
  </g>

  <g transform="translate(445,230)">
    <rect width="330" height="500" rx="30" fill="url(#card)" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="64" cy="66" r="30" fill="#60a5fa"/>
    <text x="55" y="78" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">2</text>
    <text x="42" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">Open invite</text>
    <text x="42" y="190" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">Use the TestFlight</text>
    <text x="42" y="224" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">email or public link.</text>
    <rect x="48" y="310" width="234" height="132" rx="22" fill="#08131f" stroke="#60a5fa" stroke-width="2"/>
    <text x="70" y="360" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Invite to test</text>
    <rect x="70" y="392" width="170" height="30" rx="15" fill="#60a5fa"/>
    <text x="88" y="414" fill="#082f49" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">OPEN LINK</text>
  </g>

  <g transform="translate(810,230)">
    <rect width="330" height="500" rx="30" fill="url(#card)" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="64" cy="66" r="30" fill="#60a5fa"/>
    <text x="55" y="78" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">3</text>
    <text x="42" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">Install build</text>
    <text x="42" y="190" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">Choose Ghostel in</text>
    <text x="42" y="224" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">TestFlight.</text>
    <rect x="60" y="306" width="210" height="150" rx="26" fill="#08131f" stroke="#93c5fd" stroke-width="3"/>
    <text x="90" y="360" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">Ghostel</text>
    <text x="90" y="397" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="20">Version 1.4.33</text>
    <rect x="90" y="416" width="118" height="30" rx="15" fill="#60a5fa"/>
    <text x="119" y="438" fill="#082f49" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">INSTALL</text>
  </g>

  <g transform="translate(1175,230)">
    <rect width="330" height="500" rx="30" fill="url(#card)" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="64" cy="66" r="30" fill="#60a5fa"/>
    <text x="55" y="78" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">4</text>
    <text x="42" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">Report bugs</text>
    <text x="42" y="190" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">Send clear steps,</text>
    <text x="42" y="224" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24">screenshots or logs.</text>
    <circle cx="165" cy="376" r="88" fill="#08131f" stroke="#60a5fa" stroke-width="3"/>
    <path d="M122 381l29 29 60-70" fill="none" stroke="#60a5fa" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
