<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ghostel Android tester guide</title>
  <desc id="desc">Four steps for Android testers: open the tester page, download APK, allow installation and report bugs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#112536"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102235"/>
      <stop offset="100%" stop-color="#143247"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="145" cy="130" r="58" fill="#22d3ee" opacity="0.18"/>
  <circle cx="1430" cy="115" r="78" fill="#d946ef" opacity="0.14"/>
  <text x="90" y="110" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">Android testing</text>
  <text x="90" y="158" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="26">Ghostel test build guide</text>

  <g transform="translate(80,230)">
    <rect width="330" height="500" rx="30" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="64" cy="66" r="30" fill="#22c55e"/>
    <text x="55" y="78" fill="#052e16" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">1</text>
    <text x="42" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="800">Open testers</text>
    <text x="42" y="190" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="24">Go to ghostel.app</text>
    <text x="42" y="224" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="24">and open Testing.</text>
    <rect x="52" y="310" width="226" height="116" rx="24" fill="#08131f" stroke="#22d3ee" stroke-width="2"/>
    <text x="78" y="358" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">/testers</text>
    <rect x="78" y="380" width="150" height="18" rx="9" fill="#22d3ee"/>
  </g>

  <g transform="translate(445,230)">
    <rect width="330" height="500" rx="30" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="64" cy="66" r="30" fill="#22c55e"/>
    <text x="55" y="78" fill="#052e16" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">2</text>
    <text x="42" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="800">Download APK</text>
    <text x="42" y="190" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="24">Tap Download APK</text>
    <text x="42" y="224" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="24">and wait for file.</text>
    <circle cx="165" cy="365" r="82" fill="#08131f" stroke="#22d3ee" stroke-width="3"/>
    <path d="M165 306v86" stroke="#22d3ee" stroke-width="18" stroke-linecap="round"/>
    <path d="M126 360l39 39 39-39" fill="none" stroke="#22d3ee" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(810,230)">
    <rect width="330" height="500" rx="30" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="64" cy="66" r="30" fill="#22c55e"/>
    <text x="55" y="78" fill="#052e16" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">3</text>
    <text x="42" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="800">Allow install</text>
    <text x="42" y="190" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="24">If Android asks,</text>
    <text x="42" y="224" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="24">allow this source.</text>
    <rect x="48" y="306" width="234" height="130" rx="22" fill="#08131f" stroke="#facc15" stroke-width="2"/>
    <text x="70" y="356" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Allow Ghostel?</text>
    <rect x="70" y="386" width="122" height="30" rx="15" fill="#22c55e"/>
    <text x="96" y="408" fill="#052e16" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">ALLOW</text>
  </g>

  <g transform="translate(1175,230)">
    <rect width="330" height="500" rx="30" fill="url(#card)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="64" cy="66" r="30" fill="#22c55e"/>
    <text x="55" y="78" fill="#052e16" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">4</text>
    <text x="42" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="800">Report bugs</text>
    <text x="42" y="190" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="24">Use Support and add</text>
    <text x="42" y="224" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="24">steps or screenshots.</text>
    <rect x="70" y="308" width="190" height="132" rx="28" fill="#08131f" stroke="#22c55e" stroke-width="3"/>
    <path d="M112 372h106M112 408h72M112 336h106" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
